<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BROSBNK — Simulador do Plano de Negócios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#F4F6F6; --texto:#28251D; --primaria:#0C4E54; --acento:#20808D;
  --borda:#D8DCDC; --superficie:#FFFFFF;
  --comex:#03518F; --remessas:#009743; --cripto:#F7C500; --licenca:#E2231D;
  --verde:#1B7F4B; --ambar:#B4740A; --vermelho:#B32118;
  --header-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--texto);
  font-family:'Inter','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word; word-break:normal; hyphens:none;
}
table, .kpi-valor, .num, td, th, input{font-variant-numeric:tabular-nums;}
button{font-family:inherit;}

/* ---------- Cabeçalho ---------- */
header.topo{
  position:fixed; top:0; left:0; right:0; height:var(--header-h); z-index:60;
  background:var(--superficie); border-bottom:1px solid var(--borda);
  display:flex; align-items:center; gap:16px; padding:0 16px;
}
.marca{display:flex; align-items:center; gap:12px; min-width:0;}
.marca-logo{height:36px; display:block;}
.marca-nome{font-size:13px; font-weight:600; color:var(--primaria); white-space:nowrap;}
.marca-sub{font-size:11px; color:#6B7574; white-space:nowrap;}
.topo-espaco{flex:1;}
.segmentado{display:inline-flex; background:var(--bg); border:1px solid var(--borda); border-radius:8px; padding:3px;}
.segmentado button{
  border:0; background:transparent; color:var(--texto); font-size:13px; font-weight:500;
  padding:6px 14px; border-radius:6px; cursor:pointer; white-space:nowrap;
}
.segmentado button[aria-pressed="true"]{background:var(--primaria); color:#fff;}
.btn{
  border:1px solid var(--borda); background:var(--superficie); color:var(--primaria);
  font-size:13px; font-weight:500; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
.btn:hover{border-color:var(--acento); color:var(--acento);}
.btn-primario{background:var(--primaria); color:#fff; border-color:var(--primaria);}
.btn-primario:hover{background:var(--acento); border-color:var(--acento); color:#fff;}
.btn-pequeno{padding:5px 9px; font-size:12px;}
#btnControles{display:none;}

/* ---------- Layout ---------- */
.corpo{display:flex; align-items:flex-start; padding-top:var(--header-h); min-height:100vh;}
aside.controles{
  width:380px; flex:0 0 380px; background:var(--superficie);
  border-right:1px solid var(--borda);
  position:sticky; top:var(--header-h); height:calc(100vh - var(--header-h));
  overflow-y:auto; padding:16px 16px 96px;
}
main.resultados{flex:1; min-width:0; padding:16px 20px 120px;}

/* ---------- Cartões e controles ---------- */
.cartao{background:var(--superficie); border:1px solid var(--borda); border-radius:12px; padding:16px; margin-bottom:16px;}
aside .cartao{padding:14px; margin-bottom:12px;}
.cartao-titulo{
  display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;
  color:var(--primaria); text-transform:uppercase; letter-spacing:.4px; margin:0 0 12px;
}
.cartao-titulo .pill{margin-left:auto;}
.pill{font-size:10px; font-weight:600; padding:2px 7px; border-radius:99px; background:var(--bg); color:#6B7574; border:1px solid var(--borda); text-transform:none; letter-spacing:0;}
.faixa-vertical{width:4px; height:14px; border-radius:2px; display:inline-block;}

.ctl{margin-bottom:14px;}
.ctl:last-child{margin-bottom:0;}
.ctl-topo{display:flex; align-items:baseline; gap:6px; margin-bottom:6px;}
.ctl-rot{font-size:13px; font-weight:500; flex:1; min-width:0;}
.ctl-val{font-size:13px; font-weight:700; color:var(--cor-vertical, var(--primaria)); white-space:nowrap;}
.ctl input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:20px; margin:0;
  background:transparent; cursor:pointer;
}
.ctl input[type=range]::-webkit-slider-runnable-track{
  height:6px; border-radius:99px;
  background:linear-gradient(to right, var(--cor-vertical, var(--acento)) 0 var(--preenchido,0%), #DCE3E2 var(--preenchido,0%) 100%);
}
.ctl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; margin-top:-5px;
  width:16px; height:16px; border-radius:50%;
  background:var(--cor-vertical, var(--acento)); border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.14);
}
.ctl input[type=range]::-moz-range-track{ height:6px; border-radius:99px; background:#DCE3E2; }
.ctl input[type=range]::-moz-range-progress{ height:6px; border-radius:99px; background:var(--cor-vertical, var(--acento)); }
.ctl input[type=range]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%; border:2px solid #fff;
  background:var(--cor-vertical, var(--acento)); box-shadow:0 0 0 1px rgba(0,0,0,.14);
}
.ctl input[type=range]:focus-visible{ outline:2px solid var(--cor-vertical, var(--acento)); outline-offset:3px; }
.ctl-lim{display:flex; justify-content:space-between; font-size:10.5px; color:#8A9392; margin-top:1px;}
.ctl-num{
  width:100%; border:1px solid var(--borda); border-radius:6px; padding:5px 8px;
  font-size:13px; color:var(--texto); background:var(--superficie);
}
.linha-num{display:flex; gap:8px; align-items:center;}

.chave{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;}
.chave input{position:absolute; opacity:0; width:0; height:0;}
.chave .trilho{width:40px; height:22px; border-radius:99px; background:#C8CFCE; position:relative; transition:background .15s; flex:0 0 40px;}
.chave .trilho::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s;}
.chave input:checked + .trilho{background:var(--cor-vertical, var(--acento));}
.chave input:checked + .trilho::after{left:21px;}
.chave input:disabled + .trilho{opacity:.45; cursor:not-allowed;}
.chave-rot{font-size:13px; font-weight:600;}

.aviso{border-radius:8px; padding:9px 11px; font-size:12px; line-height:1.45; margin-top:10px; border:1px solid;}
.aviso-ambar{background:#FDF6E7; border-color:#EBD9A8; color:#7A5406;}
.aviso-info{background:#EDF4F5; border-color:#C6DDE0; color:#0C4E54;}
.aviso-vermelho{background:#FCEDEC; border-color:#F3C6C3; color:#9B1B15;}

/* ---------- Ajuda / tooltips ---------- */
.ajuda{
  display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; flex:0 0 16px; border-radius:50%;
  border:1px solid var(--borda); background:var(--bg); color:var(--acento);
  font-size:10px; font-weight:700; cursor:pointer; padding:0; line-height:1;
}
.ajuda:hover{background:var(--acento); color:#fff; border-color:var(--acento);}
#tip{
  position:fixed; z-index:200; max-width:320px; background:#1E2E30; color:#F4F6F6;
  border-radius:10px; padding:11px 13px; font-size:12px; line-height:1.5;
  box-shadow:0 8px 28px rgba(0,0,0,.24); display:none;
}
#tip b{color:#8FD3DA;}
#tip .tip-form{display:block; margin-top:6px; color:#B9C6C7; font-style:italic;}
#tip .tip-fonte{display:block; margin-top:6px; font-size:11px; color:#9AAAAB;}

/* ---------- KPIs ---------- */
.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:16px;}
.kpi{background:var(--superficie); border:1px solid var(--borda); border-left:3px solid var(--acento); border-radius:10px; padding:11px 12px; min-width:0;}
.kpi-rot{display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; color:#6B7574; text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px;}
.kpi-rot span{min-width:0;}
.kpi-valor{font-size:19px; font-weight:700; color:var(--primaria); letter-spacing:-.3px;}
.kpi-nota{font-size:10.5px; color:#8A9392; margin-top:2px;}

/* ---------- Abas ---------- */
.abas{display:flex; gap:4px; border-bottom:1px solid var(--borda); margin-bottom:16px; overflow-x:auto; padding-bottom:0;}
.abas button{
  border:0; background:transparent; color:#6B7574; font-size:13.5px; font-weight:600;
  padding:9px 14px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
}
.abas button[aria-selected="true"]{color:var(--primaria); border-bottom-color:var(--primaria);}
.painel{display:none;}
.painel.ativo{display:block;}

/* ---------- Tabelas ---------- */
.tab-rolagem{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table.dados{border-collapse:collapse; width:100%; font-size:12.5px; min-width:560px;}
table.dados th, table.dados td{padding:7px 9px; text-align:right; border-bottom:1px solid var(--borda); white-space:nowrap;}
table.dados th:first-child, table.dados td:first-child{text-align:left; white-space:normal; min-width:190px;}
table.dados thead th{background:var(--bg); color:var(--primaria); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; border-bottom:1px solid var(--borda);}
table.dados tr.destaque td{font-weight:700; background:#EDF4F5;}
table.dados tr.grupo td{background:#FAFBFB; font-weight:600; color:#6B7574; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px;}
table.dados tr.selecionada td{background:#EDF4F5; font-weight:700; box-shadow:inset 3px 0 0 var(--acento);}
.neg{color:var(--vermelho);}

/* ---------- Diversos ---------- */
.grade2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grade3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grade4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.narrativa{font-size:14px; line-height:1.65; color:#3A3830; margin:0;}
.narrativa strong{color:var(--primaria);}
.legenda{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:#6B7574; margin-top:10px;}
.legenda i{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px;}
.semaforo{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:99px;}
.sem-verde{background:#E6F4EC; color:var(--verde);}
.sem-ambar{background:#FDF6E7; color:var(--ambar);}
.sem-vermelho{background:#FBEAE9; color:var(--vermelho);}
.metrica{padding:12px 0; border-bottom:1px solid var(--borda);}
.metrica:last-child{border-bottom:0;}
.metrica-rot{display:flex; align-items:center; gap:6px; font-size:11.5px; color:#6B7574; font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
.metrica-val{font-size:20px; font-weight:700; color:var(--primaria); margin-top:3px;}
.metrica-sub{font-size:11.5px; color:#8A9392; margin-top:2px;}
.moic-par{display:grid; grid-template-columns:1.25fr 1fr; gap:14px; align-items:stretch;}
.moic-forte{background:var(--primaria); color:#fff; border-radius:12px; padding:18px;}
.moic-forte .metrica-rot, .moic-forte .metrica-sub{color:#B9D6D9;}
.moic-forte .metrica-val{color:#fff; font-size:38px;}
.moic-fraco{background:var(--bg); border:1px solid var(--borda); border-radius:12px; padding:18px;}
.moic-fraco .metrica-val{font-size:26px;}
.sigla{font-size:11px; color:#8A9392; font-weight:400; display:block; margin-top:1px;}
.rodape{
  position:fixed; bottom:0; left:0; right:0; z-index:55; background:var(--superficie);
  border-top:1px solid var(--borda); padding:8px 16px; font-size:11.5px; color:#6B7574; text-align:center;
}
.cartao-total{
  background:linear-gradient(180deg,#F2F7FB 0%, var(--superficie) 62%);
  border-color:#C3D6E6;
}
.cartao-total .cartao-titulo{color:#03518F;}
.faixa-vertical-dupla{
  display:inline-block; width:4px; height:14px; border-radius:2px; margin-right:8px;
  background:linear-gradient(180deg,#03518F 0 50%, #4E8CC4 50% 100%);
  vertical-align:-2px;
}
.faixa-compartilhado{background:#EDF4F5; border-bottom:1px solid #C6DDE0; color:var(--primaria); font-size:12.5px; padding:8px 16px; text-align:center; display:none;}
.faixa-verificacao{font-size:12px; line-height:1.5;}
.mono{font-variant-numeric:tabular-nums;}

/* ---------- Glossário ---------- */
.sobreposicao{position:fixed; inset:0; background:rgba(20,30,31,.42); z-index:90; display:none;}
.sobreposicao.aberta{display:block;}
.gaveta{
  position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); background:var(--superficie);
  z-index:100; box-shadow:-8px 0 32px rgba(0,0,0,.14); transform:translateX(102%); transition:transform .2s;
  display:flex; flex-direction:column;
}
.gaveta.aberta{transform:none;}
.gaveta-topo{padding:16px; border-bottom:1px solid var(--borda); display:flex; align-items:center; gap:10px;}
.gaveta-topo h2{margin:0; font-size:16px; color:var(--primaria); flex:1;}
.gaveta-corpo{overflow-y:auto; padding:16px; flex:1;}
.busca{width:100%; border:1px solid var(--borda); border-radius:8px; padding:9px 11px; font-size:13px; margin-bottom:14px;}
.verbete{padding:12px 0; border-bottom:1px solid var(--borda);}
.verbete:last-child{border-bottom:0;}
.verbete h3{margin:0 0 2px; font-size:13.5px; color:var(--primaria);}
.verbete p{margin:5px 0 0; font-size:12.5px; line-height:1.55; color:#3A3830;}

.gaveta-controles{
  position:fixed; top:0; left:0; bottom:0; width:min(380px,92%); background:var(--superficie);
  z-index:100; box-shadow:8px 0 32px rgba(0,0,0,.14); transform:translateX(-102%); transition:transform .2s;
  overflow-y:auto;
}
.modal{
  position:fixed; z-index:110; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--superficie); border-radius:12px; padding:20px; width:min(380px,92vw);
  box-shadow:0 16px 48px rgba(0,0,0,.2); display:none;
}
.modal.aberto{display:block;}
.modal h3{margin:0 0 12px; font-size:15px; color:var(--primaria);}
.cenario-linha{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--borda);}
.cenario-linha:last-child{border-bottom:0;}
.vazio{color:#8A9392; font-size:13px; padding:18px 0; text-align:center;}

@media (max-width:1400px){ .kpis{grid-template-columns:repeat(3,1fr);} }
@media (max-width:1023px){
  aside.controles{display:none;}
  #btnControles{display:inline-block;}
  main.resultados{padding:12px 12px 130px;}
  .grade2,.grade3,.grade4{grid-template-columns:1fr;}
  .moic-par{grid-template-columns:1fr;}
  .marca-sub{display:none;}
}
@media (max-width:760px){
  :root{--header-h:108px;}
  header.topo{flex-wrap:wrap; height:auto; min-height:var(--header-h); padding:8px 12px; row-gap:8px; align-content:center;}
  .topo-espaco{flex:0 0 100%; height:0;}
  .marca-logo{height:30px;}
  .marca-nome{font-size:12px;}
  .segmentado button{padding:6px 11px; font-size:12.5px;}
  .topo .btn{padding:7px 10px; font-size:12.5px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .moic-forte .metrica-val{font-size:30px;}
}
@media (max-width:430px){
  .marca-nome, .topo .btn span.rot-longo{display:none;}
  .kpi-valor{font-size:17px;}
  table.dados th:first-child, table.dados td:first-child{min-width:150px;}
}
</style>
</head>

    multiploSaida:10, pctVendido:0.20, taxaDesconto:0.15,
    // Curva
    curvaDestravada:false, fCli:F_CLI_PADRAO.slice(), fTk:F_TK_PADRAO.slice()
  };
}

var S = estadoPadrao();
var CENARIOS = [];        // apenas em memória — nenhum dado é gravado no navegador
var avisoLicenca = false; // mostrado quando a licença é desligada junto com a cripto
var SOMENTE_LEITURA = false; // ligado quando a página é aberta por um link travado
var abaAtiva = 'resumo';

/* ---------- 3. Formatação pt-BR ---------- */

function nf(v, d){
  if(!isFinite(v)) return '—';
  return v.toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d});
}
var fmtBi   = function(v,d){ return 'R$ ' + nf(v, d===undefined?2:d) + ' bi'; };
var fmtMi   = function(v,d){ return 'R$ ' + nf(v, d===undefined?2:d) + ' mi'; };
var fmtMil  = function(v){ return 'R$ ' + nf(v,1) + ' mil'; };
var fmtRS   = function(v,d){ return 'R$ ' + nf(v, d===undefined?0:d); };
var fmtPct  = function(v,d){ return nf(v*100, d===undefined?1:d).replace('.',',') + '%'; };
var fmtX    = function(v,d){ return nf(v, d===undefined?2:d) + 'x'; };
var fmtInt  = function(v){ return nf(Math.round(v),0); };
function dataHoraBR(dt){
  dt = dt || new Date();
  return dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

/* ---------- 4. Modelo de cálculo (seção 5 da especificação) ---------- */

function opexBaseAno(i){                       // i = 0..4, resultado em R$ milhões
  var soma = 0;
  for(var k=0;k<OPEX_CATEGORIAS.length;k++){
    var linha = (S.opexCustom && S.opexCustom[k]) ? S.opexCustom[k] : OPEX_CATEGORIAS[k].v;
    soma += linha[i];
  }
  return soma / 1000;
}
function opexCategoriaValor(k,i){
  return (S.opexCustom && S.opexCustom[k]) ? S.opexCustom[k][i] : OPEX_CATEGORIAS[k].v[i];
}

function calcular(){
  var m = { anos:[1,2,3,4,5] };
  var i, a = [];
  var fCli = S.fCli, fTk = S.fTk;

  for(i=0;i<5;i++){
    var o = {};
    // 5.1 — curva por ano
    o.clientesMPE = S.mpeOn ? Math.round(S.clientesMPE5 * fCli[i]) : 0;
    o.tkMPE       = S.tkMPE5 * fTk[i];
    o.tpvComexMPE = o.clientesMPE * o.tkMPE / 1e6;              // R$ bi
    o.clientesMed = S.medOn ? Math.round(S.clientesMed5 * fCli[i]) : 0;
    o.tkMed       = S.tkMed5 * fTk[i];
    o.tpvComexMed = o.clientesMed * o.tkMed / 1e6;
    o.tpvComex    = o.tpvComexMPE + o.tpvComexMed;
    o.clientesRem = S.remessasOn ? Math.round(S.clientesRem5 * fCli[i]) : 0;
    o.tkRem       = S.tkRem5 * fTk[i];
    o.tpvRem      = o.clientesRem * o.tkRem / 1e6;
    o.tpvCripto   = S.criptoOn ? S.tpvCripto5 * fCli[i] : 0;
    o.tpvTotal    = o.tpvComex + o.tpvRem + o.tpvCripto;

    // 5.2 — P&L (R$ milhões)
    o.receitaComexMPE = o.tpvComexMPE * 1000 * S.takeComex;
    o.receitaComexMed = o.tpvComexMed * 1000 * S.takeMed;
    o.receitaComex  = o.receitaComexMPE + o.receitaComexMed;
    o.receitaRem    = o.tpvRem    * 1000 * S.takeRem;
    o.receitaCripto = o.tpvCripto * 1000 * S.takeCripto;
    o.receitaBruta  = o.receitaComex + o.receitaRem + o.receitaCripto;
    o.custoFiat     = (o.tpvComex + o.tpvRem) * 1000 * S.custoProvedores;
    o.custoCripto   = o.tpvCripto * 1000 * S.custoLiqCripto;
    o.custoExecucao = o.custoFiat + o.custoCripto;
    o.tributos      = o.receitaBruta * S.aliquota;
    o.margemContrib = o.receitaBruta - o.custoExecucao - o.tributos;
    o.opex          = opexBaseAno(i) * S.multOpex;
    o.totalClientes = o.clientesMPE + o.clientesMed + o.clientesRem;
    a.push(o);
  }

  for(i=0;i<5;i++){
    var c = a[i], p = i>0 ? a[i-1] : null;
    c.novosClientes = p ? Math.max(0, c.totalClientes - p.totalClientes) : c.totalClientes;
    c.novosComex    = p ? Math.max(0, (c.clientesMPE + c.clientesMed) - (p.clientesMPE + p.clientesMed))
                        : (c.clientesMPE + c.clientesMed);
    c.novosRem      = p ? Math.max(0, c.clientesRem - p.clientesRem) : c.clientesRem;
    c.gtm           = (c.novosComex * S.cac + c.novosRem * S.cacRem) / 1e6;
    c.ganhoLicenca  = S.licencaOn ? (c.tpvCripto*1000*S.ganhoCripto + c.tpvComex*1000*S.ganhoComex) : 0;
    c.ebitda        = c.margemContrib - c.opex - c.gtm + c.ganhoLicenca;
    c.margemEbitda  = c.receitaBruta > 0 ? c.ebitda / c.receitaBruta : 0;
    c.margemPorCliente = c.totalClientes > 0 ? c.margemContrib * 1e6 / c.totalClientes : 0;
    c.paybackDias   = c.margemPorCliente > 0 ? S.cac / (c.margemPorCliente/365) : Infinity;
  }
  m.ano = a;
  var a5 = a[4];
  m.a5 = a5;

  // 5.3 — break-even
  m.breakEven = null;
  for(i=0;i<5;i++){ if(a[i].ebitda > 0){ m.breakEven = i+1; break; } }

  // 5.3b — break-even em meses (interpolação linear dentro do ano)
  // O modelo é anual. Os meses são leitura auxiliar, não projeção mensal.
  m.breakEvenMes    = null;   // EBITDA do ano passa a ser positivo
  m.recuperacaoAno  = null;   // ano em que o EBITDA acumulado zera
  m.recuperacaoMes  = null;   // mês estimado dessa virada
  for(i=0;i<5;i++){
    if(a[i].ebitda > 0){
      if(i > 0 && a[i-1].ebitda < 0){
        var antE = a[i-1].ebitda;
        m.breakEvenMes = Math.max(i*12 + 1, Math.round(i*12 + ((-antE)/(a[i].ebitda - antE))*12));
      }
      break;
    }
  }
  var acEb = 0, acAnt = 0;
  for(i=0;i<5;i++){
    acAnt = acEb; acEb += a[i].ebitda;
    if(acEb > 0){
      m.recuperacaoAno = i+1;
      if(i > 0 && acAnt < 0){
        m.recuperacaoMes = Math.max(i*12 + 1, Math.round(i*12 + ((-acAnt)/(acEb - acAnt))*12));
      }
      break;
    }
  }

  // acumulados
  var chaves = ['tpvComex','tpvRem','tpvCripto','tpvTotal','receitaComex','receitaComexMPE','receitaComexMed','receitaRem','receitaCripto',
                'receitaBruta','custoFiat','custoCripto','custoExecucao','tributos','margemContrib',
                'opex','gtm','ganhoLicenca','ebitda'];
  m.acum = {};
  chaves.forEach(function(k){ m.acum[k] = a.reduce(function(s,o){ return s + o[k]; },0); });
  m.acum.margemEbitda = m.acum.receitaBruta > 0 ? m.acum.ebitda/m.acum.receitaBruta : 0;

  // 5.5 — mercado e penetração
  m.pen = {
    comexContagem: S.clientesMPE5 / MERCADO.universoMpe.valor,
    comexValor:    a5.tpvComexMPE / MERCADO.samComexMpe.valor,
    medias:        a5.tpvComexMed / MERCADO.samComexMedias.valor,
    remessas:      a5.tpvRem / MERCADO.tamRemessas.valor,
    cripto:        a5.tpvCripto / MERCADO.samCripto.valor
  };
  m.tkUniverso   = MERCADO.samComexMpe.valor * 1e6 / MERCADO.universoMpe.valor;  // R$ mil por empresa
  m.capturaTicket= S.tkMPE5 / m.tkUniverso;
  // médias: carteira declarada, captura derivada, universo implícito pelo SAM
  m.carteiraMed    = S.carteiraMed;
  m.capturaMed     = S.carteiraMed > 0 ? S.tkMed5 / S.carteiraMed : 0;
  m.tkMedCapturado = S.tkMed5;
  m.universoMed    = S.carteiraMed > 0 ? MERCADO.samComexMedias.valor * 1e6 / S.carteiraMed : 0;
  m.penMedContagem = m.universoMed > 0 ? S.clientesMed5 / m.universoMed : 0;
  m.gapPenetracao= m.pen.comexContagem - m.pen.comexValor;

  // 5.6 — métricas por cliente
  var ltvN = 0, ltvD = 0;
  for(var k2=0;k2<5;k2++){
    var base = a5.margemPorCliente * Math.pow(1 - S.churn, k2);
    ltvN += base;
    ltvD += base / Math.pow(1 + S.taxaDesconto, k2);
  }
  m.ltvNominal = ltvN;
  m.ltvDescontado = ltvD;
  m.ltvSobreCac = S.cac > 0 ? ltvN / S.cac : 0;
  m.ltvDescSobreCac = S.cac > 0 ? ltvD / S.cac : 0;

  // 5.7 — retorno
  m.ebitdaAno5   = a5.ebitda;
  m.valuation    = m.ebitdaAno5 * S.multiploSaida;
  m.participacao = m.valuation * S.pctVendido;
  m.investTotal  = aporteTotal();
  m.investPrim   = aporteP();
  m.investSec    = aporteS();
  m.moicTotal    = m.investTotal > 0 ? m.participacao / m.investTotal : 0;
  m.tirTotal     = m.moicTotal > 0 ? Math.pow(m.moicTotal, 1/5) - 1 : -1;

  // 5.7b — eficiência de capital da operação
  // Usa apenas o capital primário. NÃO é retorno do investidor: mede quanto
  // resultado a empresa produz por real que entrou no caixa.
  m.efic = {
    ebitdaA5:   m.investPrim > 0 ? m.ebitdaAno5  / m.investPrim : 0,
    ebitdaAcum: m.investPrim > 0 ? m.acum.ebitda / m.investPrim : 0,
    evSaida:    m.investPrim > 0 ? m.valuation   / m.investPrim : 0
  };

  // 5.8 — sensibilidade
  m.sensibilidade = [];
  for(var mult=6; mult<=16; mult+=2){
    var val = m.ebitdaAno5 * mult, part = val * S.pctVendido;
    var mt = m.investTotal > 0 ? part/m.investTotal : 0;
    m.sensibilidade.push({
      multiplo:mult, valuation:val, participacao:part,
      moicTotal:mt,
      evSobrePrimario: m.investPrim > 0 ? val/m.investPrim : 0,
      tir: mt>0 ? Math.pow(mt,1/5)-1 : -1
    });
  }
  return m;
}

var M = calcular();

var REF_ROTULO = 'padrão do plano';

function calcularCom(estado){
  var salvo = S, r;
  S = estado;
  try { r = calcular(); } finally { S = salvo; }
  return r;
}
function definirReferencia(estado, rotulo){
  REF_ESTADO = JSON.parse(JSON.stringify(estado));
  REF_ROTULO = rotulo || 'cenário padrão';

}

function premissasRef(){

function deltaVerif(){

function aplicarEscopo(qual){
  var e = estadoPadrao();

}

  margemContrib: function(){ return '<b>Margem de contribuição</b><br><br>O que sobra de cada real faturado depois de pagar o custo direto da operação e os impostos — antes das despesas da estrutura da empresa.'+

  opex: function(){ return '<b>OPEX</b><br><span style="font-size:11px;color:#9AAAAB">Operational Expenditure — despesas operacionais</span><br><br>'+

  gtm: function(){ return '<b>GTM</b><br><span style="font-size:11px;color:#9AAAAB">Go To Market</span><br><br>'+

  cac: function(){ return '<b>CAC</b><br><span style="font-size:11px;color:#9AAAAB">Customer Acquisition Cost — custo de aquisição de cliente</span><br><br>'+

  payback: function(){ return '<b>Payback de CAC</b><br><span style="font-size:11px;color:#9AAAAB">tempo de retorno do custo de aquisição</span><br><br>'+

  churn: function(){ return '<b>Churn</b><br><br>O percentual de clientes que a empresa perde por ano.<br><br><b>'+fmtPct(S.churn,1)+' ao ano</b> — não é ao mês.<br><br>'+

    'A retenção é alta porque o cliente usa a plataforma para várias coisas ao mesmo tempo — câmbio de importação, remessa, cripto — e sair significa refazer o cadastro e a integração inteira em outro lugar.'; },

  ltv: function(){ return '<b>LTV</b><br><span style="font-size:11px;color:#9AAAAB">Lifetime Value — valor do cliente ao longo do tempo</span><br><br>'+

    '<span class="tip-form">Margem de '+fmtRS(M.a5.margemPorCliente)+' por ano, com '+fmtPct(S.churn,1)+' de perda ao ano, somada ao longo de 5 anos</span>'+
    '<b>'+fmtRS(M.ltvNominal)+' por cliente</b><br>Trazido a valor de hoje, a '+fmtPct(S.taxaDesconto,0)+' ao ano: '+fmtRS(M.ltvDescontado)+'<br><br>'+
    'O cálculo para no quinto ano de propósito. Com perda baixa, o cliente teoricamente ficaria décadas, e o número perderia sentido prático.'; },

  ltvCac: function(){ return '<b>LTV/CAC</b><br><br>Quantas vezes o cliente devolve o que custou trazê-lo.'+

  sam: function(){ return '<b>SAM</b><br><span style="font-size:11px;color:#9AAAAB">Serviceable Available Market — mercado atendível</span><br><br>'+

  som: function(){ return '<b>SOM</b><br><span style="font-size:11px;color:#9AAAAB">Serviceable Obtainable Market — mercado capturável</span><br><br>'+

    'Ano 5: <b>'+fmtBi(M.a5.tpvTotal)+'</b> de volume, sendo '+fmtBi(M.a5.tpvComex)+' em COMEX e '+fmtBi(M.a5.tpvRem)+' em remessas'+

  penetracao: function(){ return '<b>Penetração de mercado</b><br><br>Que fatia do mercado o plano projeta ocupar.'+

  aporte: function(){ return '<b>Aporte da rodada</b><br><br>'+

  universoUnico: function(){ return '<b>Empresas únicas no universo</b><br><br>'+

    '<span class="tip-form">'+fmtBi(MERCADO.samComexMpe.valor)+' ÷ '+fmtInt(universoMpeEfetivo())+' = '+fmtMil(carteiraMpe())+' por empresa/ano</span>'+
    'A penetração por número de empresas continua sendo calculada sobre as '+fmtInt(MERCADO.universoMpe.valor)+' brutas — o denominador maior, que produz o percentual menor e é o mais transparente de apresentar.<br><br>'+

  carteiraMpe: function(){ return '<b>Captura da carteira — MPE</b><br><br>'+

  carteiraMed: function(){ return '<b>Carteira COMEX da média empresa</b><br><br>'+

    '<b>Captura de '+fmtPct(M.capturaMed,1)+' da carteira</b><br><br>'+
    'A empresa não troca de banco: a BROSBNK fica com uma parte do fluxo dela. Quanto maior o cliente, menor tende a ser essa fatia, porque ele tem mesa de câmbio, gerente dedicado e poder de negociação.<br><br>'+

  takeMed: function(){ return '<b>Take rate — médias empresas</b><br><br>'+

  valuation: function(){ return '<b>Valuation na saída</b><br><br>Quanto a empresa valeria no momento em que o investidor vende sua participação. O critério usado é multiplicar o resultado operacional do último ano por um número de referência de mercado.'+
    '<span class="tip-form">Ano 5: '+fmtMi(M.ebitdaAno5)+' × '+fmtX(S.multiploSaida,0)+'</span>'+

  participacao: function(){ return '<b>Valor da participação</b><br><br>Quanto vale a fatia do investidor no momento da saída.'+

    '<b>'+fmtMi(M.participacao)+'</b>'; },

  moic: function(){ return '<b>MOIC</b><br><span style="font-size:11px;color:#9AAAAB">Multiple on Invested Capital — múltiplo sobre o capital investido</span><br><br>'+

    '<span class="tip-form">'+fmtMi(M.participacao)+' ÷ '+fmtMi(M.investTotal)+'</span>'+
    '<b>'+fmtX(M.moicTotal)+'</b><br><br>'+
    'A base é sempre o total desembolsado. Os R$ 12 milhões primários e os R$ 5 milhões secundários integram a mesma rodada e adquirem participação pelo mesmo preço por ação — o retorno por real investido é igual nas duas parcelas.<br><br>'+
    'O MOIC não considera o tempo. Quem cuida do tempo é a TIR.'; },

  tir: function(){ return '<b>TIR</b><br><span style="font-size:11px;color:#9AAAAB">Taxa Interna de Retorno</span><br><br>'+
    'O retorno em percentual por ano, considerando o tempo que o dinheiro fica investido.'+
    '<span class="tip-form">(participação ÷ investido) elevado a 1/5, menos 1</span>'+
    'Transformar '+fmtMi(M.investTotal)+' em '+fmtMi(M.participacao)+' ao longo de 5 anos equivale a render <b>'+fmtPct(M.tirTotal,1)+' ao ano</b>.'; },

  licenca: function(){ return '<b>Ganho de licença própria</b><br><br>A economia obtida quando a empresa passa a operar com licença própria e deixa de pagar um intermediário para executar parte das operações.'+

    'Ano 5: <b>'+fmtMi(M.a5.ganhoLicenca)+' por ano</b><br><br>'+

    'Só produz efeito com a vertical cripto ativa, porque a licença não gera volume novo: ela melhora a margem do volume que já existe.'; },

  orquestracao: function(){ return '<b>Orquestração</b><br><br>A capacidade de coordenar vários provedores, moedas e rotas de pagamento por trás de uma interface única, escolhendo o melhor caminho para cada operação sem que o cliente precise saber disso. É a tese central do plano: quanto mais complexa a necessidade do cliente, maior o valor dessa coordenação.'; },

  descontado: function(){ return '<b>Valor presente / descontar</b><br><br>Reconhecer que R$ 1 hoje vale mais que R$ 1 daqui a cinco anos, porque o dinheiro de hoje pode ser aplicado e porque o de amanhã pode não vir.'+
    '<span class="tip-form">valor ÷ (1 + '+fmtPct(S.taxaDesconto,0)+') elevado ao número de anos</span>'+
    'A '+fmtPct(S.taxaDesconto,0)+' ao ano, cada R$ 1,00 recebido no Ano 5 equivale a R$ '+nf(1/Math.pow(1+S.taxaDesconto,5),2)+' de hoje.'; }
};

/* Notas derivadas exibidas sob os sliders de ticket. */
function notaTicketMPE(){
  var c = carteiraMpe();
  var cBruta = MERCADO.samComexMpe.valor * 1e6 / MERCADO.universoMpe.valor;
  return 'Ticket que passa pela plataforma: <b>' + fmtMil(S.tkMPE5) + ' por ano</b> — ' +
         fmtPct(S.capturaMpeIn, 0) + ' da carteira de ' + fmtMil(c) + '.' +
         '<br><span style="opacity:.75">Carteira derivada do MDIC: ' + fmtBi(MERCADO.samComexMpe.valor) +
         ' ÷ ' + fmtInt(universoMpeEfetivo()) + ' empresas' +
         (universoMpeEfetivo() < MERCADO.universoMpe.valor
            ? ' únicas. Sobre as ' + fmtInt(MERCADO.universoMpe.valor) + ' brutas seria ' + fmtMil(cBruta) +
              ', e a captura ' + fmtPct(S.tkMPE5/cBruta, 0) + '.'
            : ' — soma bruta, sem deduplicação.') + '</span>';
}
function notaTicketRem(){
  var pen = M && M.pen ? M.pen.remessas : 0;
  return 'Ticket de <b>' + fmtMil(S.tkRem5) + ' por ano</b> — cerca de ' + fmtMil(S.tkRem5/12) +
         ' por mês por cliente. A base projetada representa ' + fmtPct(pen,2) +
         ' do mercado de remessas.';
}

function valorExibido(c){
  var v = S[c.k];
  if(c.tipo==='pct')   return nf(v*100, c.passo<0.1?2:(c.passo<1?2:1)) + '%';
  if(c.tipo==='mult')  return nf(v,2)+'x';
  if(c.tipo==='mult0') return nf(v,0)+'x';
  if(c.tipo==='dec')   return nf(v,2);
  return nf(v,0);
}
function valorSlider(c){ return c.tipo==='pct' ? S[c.k]*100 : S[c.k]; }
function aplicarSlider(c, x){
  S[c.k] = c.tipo==='pct' ? x/100 : x;
  // o ticket das médias é derivado: carteira × captura
  if(c.k === 'capturaMedIn' || c.k === 'carteiraMed'){
    S.tkMed5 = S.carteiraMed * S.capturaMedIn;
  }
  if(c.k === 'capturaMpeIn' || c.k === 'universoMpeUnico'){
    S.tkMPE5 = carteiraMpe() * S.capturaMpeIn;
  }
}

function visivel(c){
  if(typeof c.quando === 'function' && !c.quando()) return false;
  if(c.modo==='ambos') return true;
  if(c.modo==='avancado') return S.modo==='avancado';
  if(c.modo==='apresentacao') return S.modo==='apresentacao';
  return true;
}

function pctPreenchido(c){
  var v = valorSlider(c);
  var p = (c.max - c.min) > 0 ? (v - c.min) / (c.max - c.min) : 0;
  return Math.max(0, Math.min(1, p)) * 100 + '%';
}

   8. Gráficos em SVG

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* Mês estimado -> "mês 16 (Ano 2)". Sem mês, cai no ano. */
function fmtMes(mes, anoFallback){
  if(mes === null || mes === undefined){
    return anoFallback ? 'dentro do Ano ' + anoFallback : 'não ocorre em 5 anos';
  }
  return 'mês ' + mes + ' <span style="font-weight:400;color:#8A9392">· Ano ' + Math.ceil(mes/12) + '</span>';
}

function graficoBarras(dados, opcoes){
  opcoes = opcoes || {};
  var L=52, R=12, T=14, B=28, W=opcoes.w||520, H=opcoes.h||220;
  var iw = W-L-R, ih = H-T-B;
  var vals = dados.map(function(d){ return d.v; });
  var maxV = Math.max.apply(null, vals.concat([0]));
  var minV = Math.min.apply(null, vals.concat([0]));
  var span = (maxV-minV) || 1;
  var y0 = T + ih * (maxV/span);
  var bw = iw/dados.length*0.58, gap = iw/dados.length;
  var s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" preserveAspectRatio="xMidYMid meet">';
  [0,0.25,0.5,0.75,1].forEach(function(f){
    var y = T + ih*f, v = maxV - span*f;
    s += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#E7EBEB"/>';
    s += '<text x="'+(L-6)+'" y="'+(y+3.5)+'" font-size="9.5" fill="#8A9392" text-anchor="end">'+nf(v,1)+'</text>';
  });
  dados.forEach(function(d,i){
    var x = L + gap*i + (gap-bw)/2;
    var hh = Math.abs(d.v)/span*ih;
    var y = d.v>=0 ? y0-hh : y0;
    s += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(hh,1)+'" rx="3" fill="'+(d.cor||(d.v>=0?'#20808D':'#E2231D'))+'"/>';
    s += '<text x="'+(x+bw/2)+'" y="'+(d.v>=0?y-4:y+hh+11)+'" font-size="10" font-weight="600" fill="#28251D" text-anchor="middle">'+esc(d.rotVal||nf(d.v,1))+'</text>';
    s += '<text x="'+(x+bw/2)+'" y="'+(H-9)+'" font-size="10" fill="#6B7574" text-anchor="middle">'+esc(d.rot)+'</text>';
  });
  s += '<line x1="'+L+'" y1="'+y0+'" x2="'+(W-R)+'" y2="'+y0+'" stroke="#B9C3C2"/></svg>';
  return s;
}

function graficoRosca(partes, opcoes){
  opcoes = opcoes || {};
  var S2 = opcoes.tam||210, cx=S2/2, cy=S2/2, rE=S2/2-6, rI=rE*0.6;
  var total = partes.reduce(function(a,p){ return a+p.v; },0);
  var s = '<svg viewBox="0 0 '+S2+' '+S2+'" width="'+S2+'" height="'+S2+'" role="img">';
  if(total<=0){ s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rE+'" fill="#E7EBEB"/></svg>'; return s; }
  var ang = -Math.PI/2;
  partes.forEach(function(p){
    if(p.v<=0) return;
    var a2 = ang + (p.v/total)*Math.PI*2;
    var grande = (a2-ang) > Math.PI ? 1 : 0;
    var x1=cx+rE*Math.cos(ang), y1=cy+rE*Math.sin(ang), x2=cx+rE*Math.cos(a2), y2=cy+rE*Math.sin(a2);
    var x3=cx+rI*Math.cos(a2), y3=cy+rI*Math.sin(a2), x4=cx+rI*Math.cos(ang), y4=cy+rI*Math.sin(ang);
    if(p.v/total > 0.9999){
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+((rE+rI)/2)+'" fill="none" stroke="'+p.cor+'" stroke-width="'+(rE-rI)+'"/>';
    } else {
      s += '<path d="M'+x1+' '+y1+' A'+rE+' '+rE+' 0 '+grande+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+rI+' '+rI+' 0 '+grande+' 0 '+x4+' '+y4+' Z" fill="'+p.cor+'"/>';
    }
    ang = a2;
  });
  s += '<text x="'+cx+'" y="'+(cy-2)+'" font-size="11" fill="#6B7574" text-anchor="middle">TPV Ano 5</text>';
  s += '<text x="'+cx+'" y="'+(cy+15)+'" font-size="15" font-weight="700" fill="#0C4E54" text-anchor="middle">'+esc(fmtBi(total))+'</text></svg>';
  return s;
}

function barraEmpilhada(partes, opcoes){
  opcoes = opcoes||{};
  var W=opcoes.w||520, H=26;
  var total = partes.reduce(function(a,p){ return a+p.v; },0);
  var s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" preserveAspectRatio="none">';
  if(total<=0){ s+='<rect width="'+W+'" height="'+H+'" rx="5" fill="#E7EBEB"/></svg>'; return s; }
  var x=0;
  partes.forEach(function(p){
    var w = p.v/total*W;
    if(w<=0) return;
    s += '<rect x="'+x+'" y="0" width="'+w+'" height="'+H+'" fill="'+p.cor+'"/>';
    if(w>52) s += '<text x="'+(x+w/2)+'" y="17" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">'+esc(nf(p.v/total*100,0))+'%</text>';
    x += w;
  });
  s += '</svg>';
  return s;
}

function graficoLinhas(series, rotulosX, opcoes){
  opcoes = opcoes||{};
  var L=52,R=14,T=14,B=28,W=opcoes.w||520,H=opcoes.h||230;
  var iw=W-L-R, ih=H-T-B;
  var maxV=0;
  series.forEach(function(se){ se.v.forEach(function(y){ if(y>maxV) maxV=y; }); });
  maxV = maxV||1;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" preserveAspectRatio="xMidYMid meet">';
  [0,0.25,0.5,0.75,1].forEach(function(f){
    var y=T+ih*f;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#E7EBEB"/>'+
       '<text x="'+(L-6)+'" y="'+(y+3.5)+'" font-size="9.5" fill="#8A9392" text-anchor="end">'+nf(maxV*(1-f),0)+'</text>';
  });
  rotulosX.forEach(function(r,i){
    var x=L+iw*(i/(rotulosX.length-1||1));
    s+='<text x="'+x+'" y="'+(H-9)+'" font-size="10" fill="#6B7574" text-anchor="middle">'+esc(r)+'</text>';
  });
  series.forEach(function(se){
    var d='';
    se.v.forEach(function(y,i){
      var px=L+iw*(i/(se.v.length-1||1)), py=T+ih*(1-y/maxV);
      d += (i?'L':'M')+px+' '+py+' ';
    });
    s+='<path d="'+d+'" fill="none" stroke="'+se.cor+'" stroke-width="2.4" stroke-linejoin="round"/>';
    se.v.forEach(function(y,i){
      var px=L+iw*(i/(se.v.length-1||1)), py=T+ih*(1-y/maxV);
      s+='<circle cx="'+px+'" cy="'+py+'" r="3.2" fill="#fff" stroke="'+se.cor+'" stroke-width="2"/>';
    });
  });
  s+='</svg>';
  return s;
}

function legenda(itens){

      '<div class="metrica-sub">'+fmtBi(MERCADO.samComexMpe.valor)+' em micro e pequenas + '+fmtBi(MERCADO.samComexMedias.valor,1)+' em médias</div></div>'+
      '<div class="metrica"><div class="metrica-rot">SOM — projetado no Ano 5 '+htmlAjuda('som')+'</div>'+
      '<div class="metrica-val">'+fmtBi(tSom)+'</div>'+
      '<div class="metrica-sub">'+fmtBi(M.a5.tpvComexMPE)+' + '+fmtBi(M.a5.tpvComexMed)+'</div>'+
      '<div class="metrica-sub" style="margin-top:8px">'+semaforo(tPenV)+'</div></div>'+
      '<div class="metrica"><div class="metrica-rot">Penetração por número de empresas '+htmlAjuda('penetracao')+'</div>'+
      '<div class="metrica-val">'+fmtPct(tPenE,2)+'</div>'+
      '<div class="metrica-sub">'+fmtInt(tCli)+' de '+fmtInt(tUni)+' empresas</div></div>'+
      '<div class="metrica"><div class="metrica-rot">Receita bruta no Ano 5</div>'+
      '<div class="metrica-val">'+fmtMi(tRec)+'</div>'+
      '<div class="metrica-sub">take rate efetiva de '+fmtPct(tTake,2)+' — '+fmtPct(S.takeComex,2)+' nas micro e pequenas, '+fmtPct(S.takeMed,2)+' nas médias</div></div>'+
      '<div class="metrica" style="border-bottom:0"><div class="metrica-rot">Participação de cada segmento no volume</div>'+
      barraEmpilhada([{rot:'Micro e pequenas', v:M.a5.tpvComexMPE, cor:CORES.comex},{rot:'Médias', v:M.a5.tpvComexMed, cor:CORES.comexMed}])+
      '<div class="metrica-sub" style="margin-top:6px">Micro e pequenas '+fmtPct(tSom>0?M.a5.tpvComexMPE/tSom:0,1)+' · médias '+fmtPct(tSom>0?M.a5.tpvComexMed/tSom:0,1)+'</div></div>'+
      '</div>';
  }

  if(S.remessasOn) h += cartaoMercado({
    id:'remessas', titulo:'Remessas', cor:CORES.remessas,
    tam: fmtBi(MERCADO.tamRemessas.valor,0), fonteTam: MERCADO.tamRemessas.fonte,
    sam: fmtBi(MERCADO.tamRemessasPjMin.valor,0)+' – '+fmtBi(MERCADO.tamRemessasPjMax.valor,0), fonteSam: 'Pessoa jurídica — '+MERCADO.tamRemessasPjMin.fonte,
    som: fmtBi(M.a5.tpvRem), pen: M.pen.remessas,
    extra: '<div class="metrica"><div class="metrica-rot">Clientes no Ano 5</div><div class="metrica-val">'+fmtInt(S.clientesRem5)+'</div>'+
           '<div class="metrica-sub">Ticket médio de '+fmtMil(M.a5.tkRem)+' por ano</div></div>'
  });
  if(S.criptoOn){
    h += cartaoMercado({
      id:'cripto', titulo:'Cripto', cor:CORES.cripto,
      tam: fmtBi(MERCADO.tamCripto.valor,1), fonteTam: MERCADO.tamCripto.fonte,
      sam: fmtBi(MERCADO.samCripto.valor,0), fonteSam: 'Segmento de stablecoins — '+MERCADO.samCripto.fonte,
      som: fmtBi(M.a5.tpvCripto), pen: M.pen.cripto
    });
  }
  h += '</div>';

  var partes = [
    {rot:'COMEX micro e pequenas', v:M.a5.tpvComexMPE, cor:CORES.comex},
    {rot:'COMEX médias',           v:M.a5.tpvComexMed, cor:CORES.comexMed},
    {rot:'Remessas',               v:M.a5.tpvRem,      cor:CORES.remessas},
    {rot:'Cripto',                 v:M.a5.tpvCripto,   cor:CORES.cripto}
  ].filter(function(p){ return p.v>0; });

  h += '<div class="cartao"><div class="cartao-titulo">Proporção do volume do Ano 5</div>'+
       barraEmpilhada(partes)+legenda(partes)+'</div>';

  h += '<div class="cartao"><div class="cartao-titulo">Legenda do semáforo</div>'+
       '<div style="display:flex;gap:14px;flex-wrap:wrap">'+
       '<span class="semaforo sem-verde">até 5% · confortável</span>'+
       '<span class="semaforo sem-ambar">de 5% a 15% · exige atenção</span>'+
       '<span class="semaforo sem-vermelho">acima de 15% · agressivo</span></div>'+
       '<div style="font-size:12.5px;color:#6B7574;margin-top:12px;line-height:1.55">O semáforo indica o quanto a projeção depende de conquistar uma fatia grande do mercado. Quanto menor a penetração necessária, menos o plano depende de um cenário perfeito.</div></div>';

  // ---- Consolidado de COMEX: MPE e médias lado a lado ----
  var somMpe = M.a5.tpvComexMPE, somMed = M.a5.tpvComexMed;
  var samMpe = MERCADO.samComexMpe.valor, samMed = MERCADO.samComexMedias.valor;
  var carMpe = carteiraMpe(), carMed = S.carteiraMed;
  var uniMpe = universoMpeEfetivo(), uniMed = M.universoMed;

  function linhaCons(rot, vMpe, vMed, vTot, tip){
    return '<tr><td>'+rot+(tip?' '+htmlAjuda(tip):'')+'</td><td>'+vMpe+'</td><td>'+vMed+'</td><td>'+(vTot===null?'—':vTot)+'</td></tr>';
  }

  h += '<div class="cartao" data-testid="consolidado-comex"><div class="cartao-titulo">COMEX consolidado — mercado, captura e penetração '+htmlAjuda('penetracao')+'</div>'+
       '<div class="tab-rolagem"><table class="dados" data-testid="tabela-consolidado"><thead><tr>'+
       '<th style="text-align:left">Indicador</th><th>Micro e pequenas</th><th>Médias</th><th>COMEX total</th>'+
       '</tr></thead><tbody>';

  h += '<tr class="grupo"><td colspan="4">Mercado</td></tr>';
  h += linhaCons('SAM — mercado atendível', fmtBi(samMpe), fmtBi(samMed,1), fmtBi(samMpe+samMed,1), 'sam');
  h += linhaCons('Universo de empresas',
        fmtInt(uniMpe) + (S.dedupOn ? ' <span style="opacity:.6">únicas</span>' : ' <span style="opacity:.6">brutas</span>'),
        fmtInt(uniMed) + ' <span style="opacity:.6">implícito</span>',
        fmtInt(uniMpe + uniMed));
  h += linhaCons('Carteira COMEX da empresa', fmtMil(carMpe), fmtMil(carMed), null, 'carteiraMpe');

  h += '<tr class="grupo"><td colspan="4">Plano no Ano 5</td></tr>';
  h += linhaCons('Clientes', fmtInt(S.clientesMPE5), fmtInt(S.clientesMed5), fmtInt(S.clientesMPE5 + S.clientesMed5));
  h += linhaCons('Ticket que passa pela plataforma', fmtMil(S.tkMPE5), fmtMil(S.tkMed5), null);
  h += linhaCons('Captura da carteira',
        '<b>'+fmtPct(S.tkMPE5/carMpe,1)+'</b>', '<b>'+fmtPct(M.capturaMed,1)+'</b>', null);
  h += linhaCons('SOM — volume projetado', fmtBi(somMpe), fmtBi(somMed), fmtBi(somMpe+somMed));
  h += linhaCons('Take rate aplicada', fmtPct(S.takeComex,2), fmtPct(S.takeMed,2),
        fmtPct((M.a5.receitaComexMPE+M.a5.receitaComexMed)/((somMpe+somMed)*1000),2));
  h += linhaCons('Receita bruta', fmtMi(M.a5.receitaComexMPE), fmtMi(M.a5.receitaComexMed),
        fmtMi(M.a5.receitaComexMPE+M.a5.receitaComexMed));

  h += '<tr class="grupo"><td colspan="4">Penetração</td></tr>';
  h += '<tr class="destaque"><td>Por número de empresas</td>'+
       '<td>'+fmtPct(S.clientesMPE5/uniMpe,2)+'</td>'+
       '<td>'+fmtPct(uniMed>0?S.clientesMed5/uniMed:0,2)+'</td>'+
       '<td>'+fmtPct((S.clientesMPE5+S.clientesMed5)/(uniMpe+uniMed),2)+'</td></tr>';
  h += '<tr class="destaque"><td>Por valor movimentado</td>'+
       '<td>'+fmtPct(somMpe/samMpe,2)+'</td>'+
       '<td>'+fmtPct(somMed/samMed,2)+'</td>'+
       '<td>'+fmtPct((somMpe+somMed)/(samMpe+samMed),2)+'</td></tr>';
  h += '</tbody></table></div>';
  h += '<div style="font-size:12.5px;color:#6B7574;line-height:1.55;margin-top:12px">'+
       'A penetração por empresas é sempre maior que a por valor, porque a BROSBNK fica com uma parte do fluxo de cada cliente e não com o total. '+
       'A relação é direta: <b>penetração por valor = penetração por empresas × captura da carteira</b>.</div>';
  if(S.dedupOn){
    h += '<div class="aviso aviso-ambar" data-testid="aviso-base-penetracao">A penetração por empresas acima usa a base deduplicada de '+fmtInt(uniMpe)+' empresas — a mesma que define a carteira. '+
         'Sobre as '+fmtInt(MERCADO.universoMpe.valor)+' brutas seria '+fmtPct(S.clientesMPE5/MERCADO.universoMpe.valor,2)+'. '+
         'Use a mesma base nas duas contas ao apresentar.</div>';
  }
  h += '</div>';

  return h;
}

function renderPaineis(){
  var abas = ABAS.filter(function(a){ return !(SOMENTE_LEITURA && a.id==='cenarios'); });

    return '<button role="tab" data-aba="'+a.id+'" data-testid="aba-'+a.id+'" aria-selected="'+(a.id===abaAtiva)+'">'+a.rot+'</button>';
  }).join('');
  var conteudo = '';
  switch(abaAtiva){
    case 'resumo':        conteudo = painelResumo(); break;
    case 'pl':            conteudo = painelPL(); break;
    case 'mercado':       conteudo = painelMercado(); break;
    case 'clientes':      conteudo = painelClientes(); break;
    case 'retorno':       conteudo = painelRetorno(); break;
    case 'sensibilidade': conteudo = painelSensibilidade(); break;
    case 'cenarios':      conteudo = painelCenarios(); break;

function renderGlossario(filtro){
  filtro = (filtro||'').toLowerCase();
  var lista = GLOSSARIO.filter(function(v){
    if(!filtro) return true;
    return (v[0]+' '+v[1]+' '+v[2]).toLowerCase().indexOf(filtro) >= 0;
  });
  document.getElementById('listaGlossario').innerHTML = lista.length ? lista.map(function(v){
    return '<div class="verbete"><h3>'+esc(v[0])+'</h3>'+(v[1]?'<span class="sigla">'+esc(v[1])+'</span>':'')+
           '<p>'+preencherGlossario(v[2])+'</p></div>';
  }).join('') : '<div class="vazio">Nenhum termo encontrado.</div>';
}

function abrirTip(alvo, html){
  var tip = document.getElementById('tip');
  tip.innerHTML = html;
  tip.style.display = 'block';
  var r = alvo.getBoundingClientRect();
  var t = tip.getBoundingClientRect();
  var x = Math.min(Math.max(8, r.left + r.width/2 - t.width/2), window.innerWidth - t.width - 8);
  var y = r.top - t.height - 10;
  if(y < 8) y = r.bottom + 10;
  tip.style.left = x+'px';
  tip.style.top  = y+'px';
}
function fecharTip(){ document.getElementById('tip').style.display='none'; }

document.addEventListener('click', function(e){
  var aj = e.target.closest ? e.target.closest('.ajuda') : null;
  if(aj){
    e.stopPropagation();
    var ref = aj.getAttribute('data-tip');
    var idx = aj.getAttribute('data-tiptxt');
    var html = ref && TIPS[ref] ? TIPS[ref]() : (idx!==null ? '<b>'+CONTROLES[+idx].rot+'</b><br><br>'+CONTROLES[+idx].tip : '');
    abrirTip(aj, html);

  fecharTip();

  var aba = e.target.closest ? e.target.closest('[data-aba]') : null;
  if(aba){ abaAtiva = aba.getAttribute('data-aba'); renderPaineis(); return; }

  var acaoEl = e.target.closest ? e.target.closest('[data-acao]') : null;

});

/* Atualização leve: mexe no valor exibido na hora e recalcula os resultados
   sem reconstruir a barra de controles (que roubaria o foco do slider). */
var pendente = null;
function agendarRender(){
  if(pendente) cancelAnimationFrame(pendente);
  pendente = requestAnimationFrame(function(){ pendente=null; render(); });
}
/* Assinatura dos avisos de coerência. Se mudar, o painel de controles precisa
   ser redesenhado — senão o aviso não aparece (nem some) durante o arrasto. */
var ASSINATURA_AVISOS = '';
function assinaturaAvisos(){
  return [
    S.tkRem5 > S.tkMPE5,
    S.tkMed5 > S.carteiraMed,
    S.carteiraMed <= (M && M.tkUniverso ? M.tkUniverso : 0),
    S.takeMed > S.takeComex,
    !!S.dedupOn,
    S.clientesMPE5 > universoMpeEfetivo(),
    (M && M.universoMed > 0 && S.clientesMed5 > M.universoMed),
    aporteTotal() <= 0
  ].map(function(b){ return b ? '1' : '0'; }).join('');
}

function atualizarLeve(c, el){
  el.style.setProperty('--preenchido', pctPreenchido(c));
  M = calcular();
  var alvos = document.querySelectorAll('[data-testid="val-'+c.k+'"]');
  for(var i=0;i<alvos.length;i++) alvos[i].textContent = valorExibido(c);
  var gemeos = document.querySelectorAll('[data-ctl="'+c.k+'"]');
  for(var j=0;j<gemeos.length;j++){ if(gemeos[j]!==el) gemeos[j].value = el.value; }
  renderKpis();
  renderPaineis();
  renderGlossario(document.getElementById('buscaGlossario').value);
  // resumo do aporte vive no painel de controles: atualiza sem redesenhar tudo
  if(c.k === 'aporteP' || c.k === 'aporteS'){
    var elTot = document.querySelector('[data-testid="investimento-total"]');
    var elDet = document.querySelector('[data-testid="investimento-detalhe"]');
    if(elTot) elTot.textContent = fmtMi(aporteTotal());
    if(elDet) elDet.textContent = 'Primário: ' + fmtMi(aporteP()) + ' · secundário: ' + fmtMi(aporteS());
    var avZero = document.querySelector('[data-testid="aviso-aporte-zero"]');
    if((aporteTotal() <= 0) !== !!avZero){ renderControles(); return; }
  }

  // notas derivadas dos tickets
  if(c.k === 'capturaMpeIn' || c.k === 'universoMpeUnico' || c.k === 'clientesMPE5'){
    var nMpe = document.querySelector('[data-testid="nota-capturaMpeIn"]');
    if(nMpe) nMpe.innerHTML = notaTicketMPE();
  }
  if(c.k === 'tkRem5' || c.k === 'clientesRem5'){
    var nRem = document.querySelector('[data-testid="nota-tkRem5"]');
    if(nRem) nRem.innerHTML = notaTicketRem();
  }

  // nota derivada da captura das médias
  if(c.k === 'capturaMedIn' || c.k === 'carteiraMed'){
    var nt = document.querySelector('[data-testid="nota-capturaMedIn"]');
    if(nt) nt.innerHTML = 'Ticket que passa pela plataforma: <b>'+fmtMil(S.carteiraMed*S.capturaMedIn)+' por ano</b> — '+fmtPct(S.capturaMedIn,0)+' de '+fmtMil(S.carteiraMed)+'.';
  }

  // avisos de coerência vivem no painel de controles: só redesenha se algum mudar
  if(assinaturaAvisos() !== ASSINATURA_AVISOS) renderControles();
}

function executarAcao(acao, el){
  if(acao==='resetOpex'){ S.opexCustom = null; render(); }
  else if(acao==='resetCurva'){ S.fCli = F_CLI_PADRAO.slice(); S.fTk = F_TK_PADRAO.slice(); render(); }
  else if(acao==='salvarCenario'){ abrirModalSalvar(); }
  else if(acao==='gerarLink'){ gerarLink(false); }
  else if(acao==='gerarLinkTravado'){ gerarLink(true); }
  else if(acao==='copiarLink'){ copiarLink(); }
  else if(acao==='restaurarPadrao'){ var modo=S.modo; S = estadoPadrao(); S.modo=modo; render(); }
  else if(acao==='carregarCenario'){ var i=+el.getAttribute('data-idx'); S = JSON.parse(JSON.stringify(CENARIOS[i].estado)); render(); }
  else if(acao==='cenarioEscopo'){ aplicarEscopo(el.getAttribute('data-escopo')); }
  else if(acao==='tornarReferencia'){ var k=+el.getAttribute('data-idx'); definirReferencia(CENARIOS[k].estado, CENARIOS[k].nome); render(); }
  else if(acao==='excluirCenario'){ var j=+el.getAttribute('data-idx');
    if(CENARIOS[j] && CENARIOS[j].nome===REF_ROTULO){ definirReferencia(estadoPadrao(),'padrão do plano'); }
    CENARIOS.splice(j,1); render(); }
}

function codificar(obj){
  var json = JSON.stringify(obj);
  var bytes = new TextEncoder().encode(json);
  var bin = '';
  bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodificar(txt){
  var b64 = txt.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

function gerarLink(travado){
  var pacote = { e:S, d:new Date().toISOString() };
  var hash = (travado ? '#/r/' : '#/c/') + codificar(pacote);
  var base = location.href.split('#')[0];
  var url = base + hash;
  var local = location.protocol === 'file:';
  var alvo = document.getElementById('linkGerado');
  if(!alvo) return;
  alvo.innerHTML = '<div class="aviso aviso-info" style="margin-top:14px" data-testid="bloco-link">'+
    '<b>Link '+(travado?'travado — abre somente leitura':'editável — abre com os controles ativos')+'</b>'+
    '<input class="busca" style="margin-top:8px" readonly value="'+esc(url)+'" data-testid="link-cenario" onclick="this.select()">'+
    '<button class="btn btn-pequeno" data-acao="copiarLink" data-testid="btn-copiar-link">Copiar link</button>'+
    (local ? '<div style="margin-top:10px;line-height:1.55">Este endereço começa com <b>file:///</b> porque o simulador está aberto como arquivo no seu computador — ele só funciona nesta máquina. Publique o arquivo em um endereço na internet e o mesmo link passa a funcionar para qualquer pessoa: o cenário viaja inteiro dentro da URL, sem servidor e sem banco de dados.</div>' : '')+
    '</div>';
  copiarLink();
}

function copiarLink(){
  var inp = document.querySelector('[data-testid=link-cenario]');
  if(!inp) return;
  inp.focus(); inp.select();
  try{ document.execCommand('copy'); }catch(err){}
  var btn = document.querySelector('[data-testid=btn-copiar-link]');
  if(btn){ btn.textContent = 'Link copiado'; setTimeout(function(){ btn.textContent = 'Copiar link'; }, 2000); }
}

function lerHash(){
  var h = location.hash || '';
  var travado = h.indexOf('#/r/') === 0;
  if(h.indexOf('#/c/') !== 0 && !travado) return false;
  try{
    var p = decodificar(h.slice(4));
    var base = estadoPadrao();
    Object.keys(base).forEach(function(k){ if(p.e[k] !== undefined) base[k] = p.e[k]; });
    S = base;
    SOMENTE_LEITURA = travado;
    var faixa = document.getElementById('faixaCompartilhado');
    var dt = p.d ? new Date(p.d) : new Date();
    faixa.textContent = 'Cenário compartilhado em ' + dataHoraBR(dt) + '. ' +
      (travado ? 'Somente leitura — os controles estão travados. ' : 'Você pode alterar os controles e explorar variações. ') +
      'Projeção gerencial.';
    faixa.style.display = 'block';
    if(travado) document.getElementById('btnSalvar').style.display = 'none';
    return true;
  }catch(err){ return false; }
}

   'tributos','margemContrib','opex','gtm','ganhoLicenca','ebitda'].forEach(function(k){

    pl.push(linha(nomes[k]+' (R$ mi)', k));
  });
  pl.push(['Margem EBITDA'].concat(M.ano.map(function(o){return o.margemEbitda;})).concat([M.acum.margemEbitda]));
  pl.push([]);
  pl.push(['OPEX por categoria (R$ mil)'].concat(anos));
  OPEX_CATEGORIAS.forEach(function(cat,k){
    pl.push([cat.nome].concat([0,1,2,3,4].map(function(i){ return opexCategoriaValor(k,i)*S.multOpex; })));
  });
  pl.push(['Total OPEX'].concat([0,1,2,3,4].map(function(i){ return opexBaseAno(i)*S.multOpex*1000; })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pl), 'P&L');

  var mk = [['Vertical','TAM (R$ bi)','SAM (R$ bi)','SOM Ano 5 (R$ bi)','Penetração','Fonte']];
  mk.push(['COMEX — micro e pequenas', MERCADO.tamComex.valor, MERCADO.samComexMpe.valor, M.a5.tpvComexMPE, M.pen.comexValor, MERCADO.samComexMpe.fonte]);
  mk.push(['COMEX — médias', MERCADO.tamComex.valor, MERCADO.samComexMedias.valor, M.a5.tpvComexMed, M.pen.medias, MERCADO.samComexMedias.fonte]);
  mk.push(['Remessas', MERCADO.tamRemessas.valor, MERCADO.tamRemessasPjMin.valor, M.a5.tpvRem, M.pen.remessas, MERCADO.tamRemessas.fonte]);
  mk.push(['Cripto', MERCADO.tamCripto.valor, MERCADO.samCripto.valor, M.a5.tpvCripto, M.pen.cripto, MERCADO.tamCripto.fonte]);
  mk.push([]);
  mk.push(['Universo de MPEs em COMEX (empresas)', MERCADO.universoMpe.valor,'','','',MERCADO.universoMpe.fonte]);
  mk.push(['Penetração por número de empresas', M.pen.comexContagem]);
  mk.push(['Penetração por valor (MPE)', M.pen.comexValor]);
  mk.push(['Ticket médio do universo (R$ mil)', M.tkUniverso]);
  mk.push(['Captura do fluxo do cliente', M.capturaTicket]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mk), 'Mercado');

  var cl = [['Linha'].concat(anos)];
  cl.push(['Clientes COMEX — micro e pequenas'].concat(M.ano.map(function(o){return o.clientesMPE;})));
  cl.push(['Clientes COMEX — médias'].concat(M.ano.map(function(o){return o.clientesMed;})));
  cl.push(['Clientes de remessas'].concat(M.ano.map(function(o){return o.clientesRem;})));
  cl.push(['Total de clientes'].concat(M.ano.map(function(o){return o.totalClientes;})));
  cl.push(['Clientes novos no ano'].concat(M.ano.map(function(o){return o.novosClientes;})));
  cl.push(['Ticket médio MPE (R$ mil)'].concat(M.ano.map(function(o){return o.tkMPE;})));
  cl.push(['Margem por cliente (R$/ano)'].concat(M.ano.map(function(o){return o.margemPorCliente;})));
  cl.push(['Payback de CAC (dias)'].concat(M.ano.map(function(o){return isFinite(o.paybackDias)?o.paybackDias:'';})));
  cl.push([]);
  cl.push(['CAC (R$)', S.cac]);
  cl.push(['Churn ao ano', S.churn]);
  cl.push(['LTV nominal 5 anos (R$)', M.ltvNominal]);
  cl.push(['LTV descontado (R$)', M.ltvDescontado]);
  cl.push(['LTV/CAC', M.ltvSobreCac]);
  cl.push(['LTV descontado/CAC', M.ltvDescSobreCac]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cl), 'Clientes');

  var rt = [['Indicador','Valor'],
    ['EBITDA Ano 5 (R$ mi)', M.ebitdaAno5],
    ['Múltiplo de saída', S.multiploSaida],
    ['Valuation (R$ mi)', M.valuation],
    ['Participação vendida', S.pctVendido],
    ['Valor da participação (R$ mi)', M.participacao],
    ['Investimento total (R$ mi)', M.investTotal],
    ['Parcela primária (R$ mi)', M.investPrim],
    ['Parcela secundária (R$ mi)', M.investSec],
    ['MOIC total', M.moicTotal],

    ['TIR total ao ano', M.tirTotal],
    ['EBITDA A5 / capital primário', M.efic.ebitdaA5],
    ['EBITDA acumulado / capital primário', M.efic.ebitdaAcum],
    ['EV de saída / capital primário', M.efic.evSaida],
    ['Break-even de resultado', M.breakEvenMes ? ('mês '+M.breakEvenMes+' (Ano '+Math.ceil(M.breakEvenMes/12)+')') : (M.breakEven ? 'dentro do Ano '+M.breakEven : 'não ocorre em 5 anos')],
    ['Prejuízo acumulado recuperado', M.recuperacaoMes ? ('mês '+M.recuperacaoMes+' (Ano '+Math.ceil(M.recuperacaoMes/12)+')') : (M.recuperacaoAno ? 'dentro do Ano '+M.recuperacaoAno : 'não ocorre em 5 anos')]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rt), 'Retorno');

  var sn = [['Múltiplo','Valuation (R$ mi)','Participação (R$ mi)','MOIC','TIR ao ano','EV / capital primário']];
  M.sensibilidade.forEach(function(l){ sn.push([l.multiplo,l.valuation,l.participacao,l.moicTotal,l.tir,l.evSobrePrimario]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sn), 'Sensibilidade');

  XLSX.writeFile(wb, 'BROSBNK_simulador_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ---------- Exportação: PDF ---------- */

function exportarPdf(){
  if(typeof window.jspdf === 'undefined'){ alert('A biblioteca de PDF não carregou. Verifique a conexão com a internet e recarregue a página.'); return; }
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({unit:'pt', format:'a4'});
  var L = 40, y = 46, W = doc.internal.pageSize.getWidth();

  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(12,78,84);
  doc.text('BROSBNK', L, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(60,60,60);
  doc.text('Simulador do Plano de Negócios — Operação Brasil', L+86, y);
  doc.setFontSize(8.5); doc.setTextColor(120,125,125);
  doc.text(dataHoraBR(), W-L, y, {align:'right'});
  y += 12;
  doc.setDrawColor(216,220,220); doc.line(L, y, W-L, y); y += 18;

  var kpis = [
    ['TPV Ano 5', fmtBi(M.a5.tpvTotal)],
    ['Receita bruta Ano 5', fmtMi(M.a5.receitaBruta)],
    ['EBITDA Ano 5', fmtMi(M.a5.ebitda)],
    ['Margem EBITDA', fmtPct(M.a5.margemEbitda,1)],
    ['MOIC (sobre '+fmtMi(M.investTotal)+')', fmtX(M.moicTotal)],
    ['TIR ao ano', fmtPct(M.tirTotal,1)]
  ];
  var cw = (W-2*L)/3;
  kpis.forEach(function(k,i){
    var cx = L + cw*(i%3), cy = y + Math.floor(i/3)*44;
    doc.setFontSize(7.5); doc.setTextColor(120,125,125); doc.text(k[0].toUpperCase(), cx, cy);
    doc.setFontSize(14); doc.setTextColor(12,78,84); doc.setFont('helvetica','bold');
    doc.text(k[1], cx, cy+16); doc.setFont('helvetica','normal');
  });
  y += 96;

  var corpo = [];
  function ln(rot, chave, dec){ return [rot].concat(M.ano.map(function(o){ return nf(o[chave], dec===undefined?2:dec); })).concat([nf(M.acum[chave], dec===undefined?2:dec)]); }
  corpo.push(ln('TPV total (R$ bi)','tpvTotal'));
  corpo.push(ln('Receita bruta (R$ mi)','receitaBruta'));
  corpo.push(ln('Custo de execução (R$ mi)','custoExecucao'));
  corpo.push(ln('Provisão tributária (R$ mi)','tributos'));
  corpo.push(ln('Margem de contribuição (R$ mi)','margemContrib'));
  corpo.push(ln('OPEX (R$ mi)','opex',3));
  corpo.push(ln('GTM (R$ mi)','gtm',3));
  if(S.licencaOn) corpo.push(ln('Ganho de licença (R$ mi)','ganhoLicenca',3));
  corpo.push(ln('EBITDA (R$ mi)','ebitda'));
  corpo.push(['Margem EBITDA'].concat(M.ano.map(function(o){ return fmtPct(o.margemEbitda,1); })).concat([fmtPct(M.acum.margemEbitda,1)]));

  doc.autoTable({
    startY:y, head:[['Linha','Ano 1','Ano 2','Ano 3','Ano 4','Ano 5','Acum.']], body:corpo,
    theme:'grid', margin:{left:L,right:L},
    styles:{fontSize:7.6, cellPadding:3, textColor:[40,37,29], lineColor:[216,220,220]},
    headStyles:{fillColor:[12,78,84], textColor:[255,255,255], fontSize:7.6},
    columnStyles:{0:{halign:'left',cellWidth:132},1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}},
    didParseCell:function(d){ if(d.row.index>=corpo.length-2 && d.section==='body'){ d.cell.styles.fontStyle='bold'; } }
  });
  y = doc.lastAutoTable.finalY + 16;

  var penBody = [
    ['COMEX micro e pequenas — por valor', fmtBi(M.a5.tpvComexMPE), fmtBi(MERCADO.samComexMpe.valor), fmtPct(M.pen.comexValor,2)],
    ['COMEX micro e pequenas — por empresas', fmtInt(S.clientesMPE5), fmtInt(MERCADO.universoMpe.valor), fmtPct(M.pen.comexContagem,2)],
    ['COMEX médias', fmtBi(M.a5.tpvComexMed), fmtBi(MERCADO.samComexMedias.valor,1), fmtPct(M.pen.medias,2)],
    ['Remessas', fmtBi(M.a5.tpvRem), fmtBi(MERCADO.tamRemessas.valor,0), fmtPct(M.pen.remessas,2)]
  ];
  if(S.criptoOn) penBody.push(['Cripto', fmtBi(M.a5.tpvCripto), fmtBi(MERCADO.samCripto.valor,0), fmtPct(M.pen.cripto,2)]);
  doc.autoTable({
    startY:y, head:[['Penetração de mercado (Ano 5)','Projetado','Mercado atendível','Penetração']], body:penBody,
    theme:'grid', margin:{left:L,right:L},
    styles:{fontSize:7.6, cellPadding:3, lineColor:[216,220,220]},
    headStyles:{fillColor:[32,128,141], textColor:[255,255,255], fontSize:7.6},
    columnStyles:{0:{halign:'left'},1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}}
  });
  y = doc.lastAutoTable.finalY + 16;

  doc.autoTable({
    startY:y, head:[['Retorno','Valor','Indicador','Valor']],
    body:[
      ['Valuation na saída', fmtMi(M.valuation), 'MOIC sobre '+fmtMi(M.investTotal), fmtX(M.moicTotal)],
      ['Valor da participação', fmtMi(M.participacao), 'EBITDA A5 / capital primário', fmtX(M.efic.ebitdaA5)],
      ['Participação vendida', fmtPct(S.pctVendido,0), 'TIR sobre '+fmtMi(M.investTotal), fmtPct(M.tirTotal,1)+' a.a.'],
      ['Múltiplo de saída', fmtX(S.multiploSaida,0), 'EV de saída / capital primário', fmtX(M.efic.evSaida)],
      ['Break-even', M.breakEvenMes?('mês '+M.breakEvenMes):(M.breakEven?('Ano '+M.breakEven):'—'), 'LTV / CAC', nf(M.ltvSobreCac,1)+'x'],
      ['Acumulado recuperado', M.recuperacaoMes?('mês '+M.recuperacaoMes):(M.recuperacaoAno?('Ano '+M.recuperacaoAno):'—'), '', '']
    ],
    theme:'grid', margin:{left:L,right:L},
    styles:{fontSize:7.6, cellPadding:3, lineColor:[216,220,220]},
    headStyles:{fillColor:[32,128,141], textColor:[255,255,255], fontSize:7.6},
    columnStyles:{0:{halign:'left'},1:{halign:'right'},2:{halign:'left'},3:{halign:'right'}}
  });
  y = doc.lastAutoTable.finalY + 14;

  doc.setFontSize(7.4); doc.setTextColor(120,125,125);
  doc.text(fmtMi(M.investTotal)+', sendo '+fmtMi(M.investPrim)+' primários e '+fmtMi(M.investSec)+' secundários.', L, y); y += 11;
  var prem = premissasLista().filter(function(p){ return p[0]!=='Aviso'; })
    .map(function(p){ return p[0]+': '+(typeof p[1]==='number' ? nf(p[1], Math.abs(p[1])<1 ? 4 : 2) : p[1]); }).join(' · ');
  var linhasPrem = doc.splitTextToSize('Premissas: '+prem, W-2*L);
  doc.text(linhasPrem, L, y); y += linhasPrem.length*8.6 + 6;
  doc.setTextColor(12,78,84); doc.setFont('helvetica','bold');
  doc.text(AVISO, L, y);
  doc.setFont('helvetica','normal');

  // Anexo — glossário
  doc.addPage();
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(12,78,84);
  doc.text('Anexo — Glossário', L, 46);
  doc.autoTable({
    startY:60,
    head:[['Termo','Definição']],
    body: GLOSSARIO.map(function(v){
      return [v[0] + (v[1] ? '\n('+v[1]+')' : ''), preencherGlossario(v[2]).replace(/<[^>]+>/g,'')];
    }),
    theme:'grid', margin:{left:L,right:L},
    styles:{fontSize:7.2, cellPadding:3.5, lineColor:[216,220,220], valign:'top'},
    headStyles:{fillColor:[12,78,84], textColor:[255,255,255]},
    columnStyles:{0:{cellWidth:104, fontStyle:'bold'},1:{halign:'left'}}
  });
  var yy = doc.lastAutoTable.finalY + 14;
  if(yy > doc.internal.pageSize.getHeight()-40){ doc.addPage(); yy = 46; }
  doc.setFontSize(7.8); doc.setTextColor(12,78,84); doc.setFont('helvetica','bold');
  doc.text(AVISO, L, yy);

  // Rodapé em todas as páginas
  var total = doc.internal.getNumberOfPages();
  for(var p=1;p<=total;p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(140,145,145);
    doc.text(AVISO + '  ·  Gerado em ' + dataHoraBR(), L, doc.internal.pageSize.getHeight()-20);
    doc.text(p+'/'+total, W-L, doc.internal.pageSize.getHeight()-20, {align:'right'});
  }
  doc.save('BROSBNK_simulador_'+new Date().toISOString().slice(0,10)+'.pdf');
}

/* ---------- Inicialização ---------- */

function abrirGaveta(id){
  document.getElementById(id).classList.add('aberta');
  document.getElementById(id).setAttribute('aria-hidden','false');
  document.getElementById('sobreposicao').classList.add('aberta');
}
function fecharGavetas(){
  ['gavetaGlossario','gavetaControles'].forEach(function(id){
    var el = document.getElementById(id);
    if(el){ el.classList.remove('aberta'); el.setAttribute('aria-hidden','true'); }
  });
  document.getElementById('sobreposicao').classList.remove('aberta');
  fecharModalSalvar();
}

(function init(){
  // gaveta de controles para telas estreitas
  var gav = document.createElement('aside');
  gav.className = 'gaveta-controles';
  gav.id = 'gavetaControles';
  gav.setAttribute('aria-hidden','true');
  document.body.appendChild(gav);

  document.getElementById('modoApresentacao').onclick = function(){ S.modo='apresentacao'; render(); };
  document.getElementById('modoAvancado').onclick     = function(){ S.modo='avancado';     render(); };
  document.getElementById('btnGlossario').onclick     = function(){ abrirGaveta('gavetaGlossario'); };
  document.getElementById('fecharGlossario').onclick  = fecharGavetas;
  document.getElementById('sobreposicao').onclick     = fecharGavetas;
  document.getElementById('btnControles').onclick     = function(){ abrirGaveta('gavetaControles'); };
  document.getElementById('btnSalvar').onclick        = abrirModalSalvar;
  document.getElementById('cancelarSalvar').onclick   = fecharModalSalvar;
  document.getElementById('confirmarSalvar').onclick  = salvarCenario;
  document.getElementById('btnXlsx').onclick          = exportarXlsx;
  document.getElementById('btnPdf').onclick           = exportarPdf;
  document.getElementById('nomeCenario').addEventListener('keydown', function(e){ if(e.key==='Enter') salvarCenario(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ fecharGavetas(); fecharTip(); } });

  lerHash();
  render();
})();
</script>
